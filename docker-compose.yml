services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-test}
      MYSQL_USER: ${MYSQL_USER:-app_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes:
      - ./docker/volumes/mysql/data:/var/lib/mysql
      - ./docker/volumes/mysql/init:/docker-entrypoint-initdb.d  # 初始化脚本目录
    ports:
      - "3307:3306"  # 保持与你原来代码相同的端口
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args:
        - DOCKER_BUILDKIT=1
    image: shanhai-api:0.1.0
    container_name: api-dev
    working_dir: /app
    volumes:
      - ./server:/app/server
      - ./src:/app/src
      - ./saves:/app/saves
      - ./test:/app/test
      - ./tianshu/data/output:/app/output:rw
      - ./saves/data/copypath:/app/saves/data/copypath:rw
      - ./indexing:/app/indexing:rw
      - ./indexing_drill:/app/indexing_drill:rw
      - ${MODEL_DIR:-./models}:/models  # 使用默认值处理未定义的环境变量
      # SQLite 数据库放在命名卷而非 bind mount 上，规避 Docker Desktop FUSE 对 server.db 路径的陈旧句柄问题
      - sage_db:/app/db
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
        limits:
          memory: 40g
    ports:
      - "5050:5050"
    networks:
      - app-network
    # 容器内可以通过 host.docker.internal 访问宿主机上的服务
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NEO4J_URI=bolt://graph:7687
      - NEO4J_USERNAME=${NEO4J_USERNAME:?Set NEO4J_USERNAME in .env}
      - SAGE_DB_PATH=/app/db/server.db
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      - MYSQL_HOST=${MYSQL_HOST:-mysql}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-test}
      - MYSQL_USER=${MYSQL_USER:-app_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      - MILVUS_URI=http://milvus:19530
      - MINERU_OCR_URI=http://mineru-api:5051
      - MODEL_DIR=/models
      - RUNNING_IN_DOCKER=true
      # 9.3.1：CORS 显式来源（逗号分隔），未设置时后端回退本机开发来源；不再用 "*"+credentials
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      # I1.1/I1.3：多模态由 MULTIMODAL_ENABLED + MULTIMODAL_MODE 显式控制；
      # Base URL 不再有硬编码私网 IP 静默默认值（未配置即为多模态未启用）。
      - MULTIMODAL_ENABLED=${MULTIMODAL_ENABLED:-}
      - MULTIMODAL_MODE=${MULTIMODAL_MODE:-remote}
      - MULTIMODAL_KB_API_BASE=${MULTIMODAL_KB_API_BASE:-}
      - MULTIMODAL_KB_DEFAULT_KB_ID=${MULTIMODAL_KB_DEFAULT_KB_ID:-}
      - MULTIMODAL_KB_TIMEOUT=${MULTIMODAL_KB_TIMEOUT:-30}
      - MULTIMODAL_KB_TOP_K=${MULTIMODAL_KB_TOP_K:-5}
      # I1.3/4.1.2：内网 http 远端须显式 MULTIMODAL_ALLOW_HTTP=1（未设置保持默认关闭）
      - MULTIMODAL_ALLOW_HTTP=${MULTIMODAL_ALLOW_HTTP:-}
      - MODEL_CREDENTIAL_MASTER_KEY=${MODEL_CREDENTIAL_MASTER_KEY:?Set MODEL_CREDENTIAL_MASTER_KEY in .env}
      - USER_MODEL_ALLOWED_HOSTS=${USER_MODEL_ALLOWED_HOSTS:-}
      - USER_MODEL_ALLOW_HTTP=${USER_MODEL_ALLOW_HTTP:-false}
      - GRAPH_INTERNAL_TOKEN=${GRAPH_INTERNAL_TOKEN:?Set GRAPH_INTERNAL_TOKEN in .env}
      - GRAPH_GROUND_IMPORT_ROOT=/app/indexing/ground_graph_fill
      - GRAPH_DRILL_IMPORT_ROOT=/app/indexing_drill/drill_graph_fill
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      - BOCHA_API_KEY=${BOCHA_API_KEY:-}
      - BLOCKING_WORKERS=${BLOCKING_WORKERS:-8}
      - CHAT_CONCURRENCY=${CHAT_CONCURRENCY:-2}
      - RETRIEVAL_CONCURRENCY=${RETRIEVAL_CONCURRENCY:-4}
      - GRAPH_IMPORT_CONCURRENCY=${GRAPH_IMPORT_CONCURRENCY:-1}
      - UPSTREAM_PROXY_CONCURRENCY=${UPSTREAM_PROXY_CONCURRENCY:-16}
      - CONCURRENCY_ACQUIRE_TIMEOUT=${CONCURRENCY_ACQUIRE_TIMEOUT:-30}
      - MULTIMODAL_HTTP_CONNECT_TIMEOUT=${MULTIMODAL_HTTP_CONNECT_TIMEOUT:-10}
      - MULTIMODAL_HTTP_READ_TIMEOUT=${MULTIMODAL_HTTP_READ_TIMEOUT:-600}
      - MULTIMODAL_HTTP_WRITE_TIMEOUT=${MULTIMODAL_HTTP_WRITE_TIMEOUT:-60}
      - MULTIMODAL_HTTP_POOL_TIMEOUT=${MULTIMODAL_HTTP_POOL_TIMEOUT:-10}
      - MULTIMODAL_HTTP_MAX_CONNECTIONS=${MULTIMODAL_HTTP_MAX_CONNECTIONS:-40}
      - MULTIMODAL_HTTP_MAX_KEEPALIVE=${MULTIMODAL_HTTP_MAX_KEEPALIVE:-20}
      - MULTIMODAL_HTTP_KEEPALIVE_EXPIRY=${MULTIMODAL_HTTP_KEEPALIVE_EXPIRY:-30}
      - GRAPH_WORKER_URL=${GRAPH_WORKER_URL:-http://graphrag-worker:8111}
      - GRAPH_WORKER_CONNECT_TIMEOUT=${GRAPH_WORKER_CONNECT_TIMEOUT:-5}
      - GRAPH_WORKER_READ_TIMEOUT=${GRAPH_WORKER_READ_TIMEOUT:-30}
      - GRAPH_WORKER_WRITE_TIMEOUT=${GRAPH_WORKER_WRITE_TIMEOUT:-10}
      - GRAPH_WORKER_POOL_TIMEOUT=${GRAPH_WORKER_POOL_TIMEOUT:-5}
      - GRAPH_WORKER_MAX_CONNECTIONS=${GRAPH_WORKER_MAX_CONNECTIONS:-10}
      - GRAPH_WORKER_MAX_KEEPALIVE=${GRAPH_WORKER_MAX_KEEPALIVE:-5}
      - TIANSHU_API_BASE=${TIANSHU_API_BASE:-http://tianshu-backend:8000/api/v1}
      - TIANSHU_CONNECT_TIMEOUT=${TIANSHU_CONNECT_TIMEOUT:-10}
      - TIANSHU_READ_TIMEOUT=${TIANSHU_READ_TIMEOUT:-60}
      # 本机邮件告警（仅环境变量注入，绝不落库/出现在 API 响应）
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - ALERT_CHECK_INTERVAL_SECONDS=${ALERT_CHECK_INTERVAL_SECONDS:-60}
      - ALERT_EVALUATE_TIMEOUT_SECONDS=${ALERT_EVALUATE_TIMEOUT_SECONDS:-90}
      # 本机文档上传
      - UPLOAD_ALLOWED_EXTENSIONS=${UPLOAD_ALLOWED_EXTENSIONS:-}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-100}
    depends_on:
      mysql:
        condition: service_healthy
    command: uv run uvicorn server.main:app --host 0.0.0.0 --port 5050 --reload
    # 4.1.6：有效健康检查——应用子进程退出时容器不得继续显示虚假的健康状态。
    # 直接探测 /api/health；进程死亡/端口关闭时 urllib 抛异常 → 容器标记 unhealthy。
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      # 只构建web.Dockerfile中的开发环境
      target: development
    image: shanhai-web:0.1.0
    container_name: web-dev
    volumes:
      - ./web:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://api:5050
      # 禁止 pnpm 按 package.json 的 packageManager 字段自我下载匹配版本，
      # 避免每次启动都联网装 pnpm（镜像里已固定 10.11.0）
      - npm_config_manage_package_manager_versions=false
      # 不要透传宿主机回环代理：容器内 127.0.0.1 指向容器自身（无效），
      # 会导致 pnpm 拉包报 ERR_PNPM_META_FETCH_FAIL。运行时依赖已随镜像安装，
      # vite 开发服务器无需联网；如需真实代理，请显式写成可被容器访问的
      # 宿主网关地址（host.docker.internal 对应端口），不要用回环地址。
    command: pnpm run server
    # 9.2.4：Web 服务也应有真实健康检查（开发态检查 Vite 端口 5173；
    # 生产态由 docker-compose.prod.yml 覆盖为 nginx :80 的 wget 检查）
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5173', r => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  graph:
    image: neo4j:5.26
    container_name: graph
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - ./docker/volumes/neo4j/data:/data
      - ./docker/volumes/neo4j/logs:/var/lib/neo4j/logs
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME:?Set NEO4J_USERNAME}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      - NEO4J_server_bolt_listen__address=0.0.0.0:7687
      - NEO4J_server_http_listen__address=0.0.0.0:7474
      - ENTITY_EMBEDDING=true
    healthcheck:
      # 9.2.4：Neo4j 真实健康检查——HTTP 端口可响应即存活（wget 不带凭据，不触碰认证）
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:7474/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network
    restart: unless-stopped

  etcd:
    container_name: milvus-etcd-dev
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./docker/volumes/milvus/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
      - app-network
    restart: unless-stopped

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
    volumes:
      - ./docker/volumes/milvus/minio:/minio_data
    command: minio server /minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
      - app-network
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.5.6
    container_name: milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
      MILVUS_LOG_LEVEL: error
    volumes:
      - ./docker/volumes/milvus/milvus:/var/lib/milvus
      - ./docker/volumes/milvus/logs:/var/lib/milvus/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 60s
      start_period: 120s
      timeout: 30s
      retries: 5
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "etcd"
      - "minio"
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network
    restart: unless-stopped

  # 文档解析服务
  mineru-api:
    build:
      context: scripts/mineru-api
      dockerfile: Dockerfile
    image: mineru-api:latest
    container_name: mineru-api
    profiles:
      - all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    ports:
      - "5051:5051"
    networks:
      - app-network
    restart: unless-stopped
    command: python -m uvicorn app:app --host 0.0.0.0 --port 5051 --app-dir /app

  tianshu-backend:
    build:
      context: ./mineru-tianshu
      dockerfile: backend/Dockerfile
    image: tianshu-backend:latest
    container_name: tianshu-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./tianshu/models:/app/models:rw
      - ./tianshu/data/uploads:/app/uploads:rw
      - ./tianshu/data/output:/app/output:rw
      - ./tianshu/logs/backend:/app/logs:rw
      - ./tianshu/data/db:/app/data/db:rw
      - ./saves/data/graphragfile:/app/saves/data/graphragfile:rw
      - ./saves/data/copypath:/app/saves/data/copypath:rw
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=INFO
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      - WORKER_URL=http://tianshu-worker:8001
      - DATABASE_PATH=/app/data/db/mineru_tianshu.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - app-network
    depends_on:
      tianshu-worker:
        condition: service_healthy


  tianshu-worker:
    build:
      context: ./mineru-tianshu
      dockerfile: backend/Dockerfile
    image: tianshu-worker:latest
    container_name: tianshu-worker
    restart: unless-stopped
    command: [ "python", "litserve_worker.py", "--port", "8001" ]
    ports:
      - "8001:8001"
    volumes:
      - ./tianshu/models:/app/models:ro
      - ./tianshu/data/uploads:/app/uploads:ro
      - ./tianshu/data/output:/app/output:rw
      - ./tianshu/logs/worker:/app/logs:rw
      - ./tianshu/data/db:/app/data/db:rw
      - ./saves/data/graphragfile:/app/saves/data/graphragfile:rw
      - ./saves/data/copypath:/app/saves/data/copypath:rw
    environment:
      - HOST=0.0.0.0
      - PORT=8001
      - LOG_LEVEL=INFO
      - DATABASE_PATH=/app/data/db/mineru_tianshu.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      - HF_ENDPOINT=https://hf-mirror.com
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - app-network

  graphrag-worker:
    build:
      context: .
      dockerfile: docker/graphrag.Dockerfile
    image: graphrag-worker:0.1.1
    container_name: graphrag-worker
    working_dir: /app
    volumes:
      - ./indexing:/app/indexing:rw
      - ./indexing_drill:/app/indexing_drill:rw
      - ./saves/data/graphragfile:/app/saves/data/graphragfile:rw
      - ./saves/data/copypath:/app/saves/data/copypath:rw
      - ./graphrag_api:/app/graphrag_api:rw
      - ./saves/data/graphrag-jobs:/app/jobs:rw
    expose:
      - "8111"
    environment:
      - GRAPH_JOB_DB=/app/jobs/jobs.db
      - GRAPH_INTERNAL_TOKEN=${GRAPH_INTERNAL_TOKEN:?Set GRAPH_INTERNAL_TOKEN in .env}
      - MAIN_API_INTERNAL_URL=http://api:5050/api/data/graph/internal/import
      - GRAPH_IMPORT_TIMEOUT=${GRAPH_IMPORT_TIMEOUT:-1800}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8111/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network
    restart: unless-stopped
  
  # 知识字典 worker（设计文档 §5：独立进程领取租约，不占用 API 事件循环）
  dictionary-worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: shanhai-api:0.1.0
    container_name: dictionary-worker
    working_dir: /app
    volumes:
      - ./server:/app/server
      - ./src:/app/src
      - ./saves:/app/saves
      - ./XinJiang:/app/XinJiang:ro
      - ${MODEL_DIR:-./models}:/models
      - sage_db:/app/db
    environment:
      - MILVUS_URI=http://milvus:19530
      - MODEL_DIR=/models
      - RUNNING_IN_DOCKER=true
      - SAGE_DB_PATH=/app/db/server.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      - MODEL_CREDENTIAL_MASTER_KEY=${MODEL_CREDENTIAL_MASTER_KEY:?Set MODEL_CREDENTIAL_MASTER_KEY in .env}
      - MYSQL_HOST=${MYSQL_HOST:-mysql}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-test}
      - MYSQL_USER=${MYSQL_USER:-app_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      - NEO4J_URI=bolt://graph:7687
      - NEO4J_USERNAME=${NEO4J_USERNAME:?Set NEO4J_USERNAME in .env}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      - DICTIONARY_VECTOR_ENABLED=${DICTIONARY_VECTOR_ENABLED:-true}
      - DICTIONARY_GENERATE_CONCURRENCY=${DICTIONARY_GENERATE_CONCURRENCY:-1}
      - DICTIONARY_INDEX_CONCURRENCY=${DICTIONARY_INDEX_CONCURRENCY:-1}
      - DICTIONARY_LEASE_TTL_SECONDS=${DICTIONARY_LEASE_TTL_SECONDS:-120}
      - DICTIONARY_WORKER_POLL_SECONDS=${DICTIONARY_WORKER_POLL_SECONDS:-3}
      # 上传文件受控存储随 saves 卷持久化
      - DICTIONARY_UPLOAD_ROOT=/app/saves/dictionary_uploads
    depends_on:
      mysql:
        condition: service_healthy
      milvus:
        condition: service_healthy
    command: uv run python -m server.dictionary_worker
    networks:
      - app-network
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # OLMOCR 模型服务
  olmocr:
    build:
      context: ./olmocr
      dockerfile: Dockerfile
    image: olmocr-service:latest
    container_name: olmocr-service
    # I1.2：rag-backend 专用的 OCR 服务同样只随 local-multimodal profile 启动。
    profiles:
      - local-multimodal
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "8005:8005"
    volumes:
      - ./olmocr/olmOCR-2-7B-1025-FP8:/app/model
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8005
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # 新增的多模态 RAG 后端服务
  
  rag-backend:
    build:
      context: ./mul_rag/backend  # 指定 Dockerfile 所在的目录
      dockerfile: Dockerfile
    container_name: multimodal_rag_backend
    # I1.2：本地多模态 RAG 后端只随 local-multimodal profile 启动，
    # 默认/生产启动不拉起本机 8002 服务。
    profiles:
      - local-multimodal
    ports:
      - "8002:8002"  # 映射主机 8002 到容器 8002
    volumes:
      # 挂载知识库数据目录，确保重启容器数据不丢失
      # 请根据 app.py 中实际的数据保存路径修改冒号后面的路径
      - ./mul_rag/backend/knowledge_base:/app/knowledge_base
      - ./mul_rag/backend/data:/app/data:z
      - ./mul_rag/backend/logs:/app/logs
    environment:
      - TZ=Asia/Shanghai
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLM_OCR_ENDPOINT=http://olmocr:8005/v1/chat/completions
    # depends_on:
    #   - olmocr
    # 如果你的机器有 NVIDIA 显卡且需要 GPU 加速，请取消注释以下部分：
    deploy:
       resources:
         reservations:
           devices:
             - driver: nvidia
               count: all
               capabilities: [gpu]
    networks:
      - app-network
    # ★★★ 新增：配置宿主机网络映射 (Linux必须，Windows/Mac建议加上) ★★★
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  sage_db:
    name: sage-master_sage_db
